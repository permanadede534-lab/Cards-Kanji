/* ===== BASE ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font:15px/1.45 "Figtree","Zen Kaku Gothic New",system-ui,sans-serif;display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit}
.app{position:relative;width:100%;max-width:430px;height:100%;max-height:920px;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(70% 38% at 105% -4%,color-mix(in srgb,var(--g1) 20%,transparent),transparent 70%),radial-gradient(60% 34% at -10% 104%,color-mix(in srgb,var(--g2) 16%,transparent),transparent 70%),var(--bg);padding-top:env(safe-area-inset-top,0)}
@media(min-width:520px){.app{height:min(840px,96%);border-radius:46px;border:9px solid var(--fr);box-shadow:0 30px 80px rgba(0,0,0,.3)}}
#scr{flex:1;display:flex;flex-direction:column;min-height:0}
.dsp{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif}
.jp{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif}
.kn{font-family:"Klee One","Noto Serif JP","Hiragino Mincho ProN",serif;font-weight:600}
.ka{font-family:"Klee One","Noto Serif JP","Hiragino Mincho ProN",serif;font-weight:400}
.ar{font-family:Calibri,Carlito,"Segoe UI","Figtree",system-ui,sans-serif}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i .f{fill:currentColor;opacity:.16;stroke:none}.i .s{fill:currentColor;stroke:none}
/* ===== TOP BARS ===== */
.top{display:flex;align-items:center;gap:12px;padding:16px 20px 8px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.seal{width:46px;height:46px;border-radius:15px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700;transform:rotate(-6deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.28),0 10px 18px -8px var(--ac);flex:none}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.top p{margin:2px 0 0;color:var(--mu);font-size:13px;font-weight:500}
.rb{width:44px;height:44px;border-radius:50%;border:0;background:var(--sf);color:var(--tx);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 1px var(--ln);flex:none}
.rb:active{transform:scale(.92)}
.page{flex:1;overflow-y:auto;padding:6px 18px 150px;scrollbar-width:none}.page::-webkit-scrollbar{display:none}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
.sec h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
.vs{display:flex;background:var(--s2);border-radius:999px;padding:3px}
.vs button{border:0;background:none;width:38px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--mu);cursor:pointer}
.vs button.on{background:var(--sf);color:var(--pr);box-shadow:0 2px 8px rgba(0,0,0,.12)}
/* ===== BOARD ===== */
.board{display:flex;gap:14px;align-items:center;padding:20px;border-radius:32px;color:#fff;background:linear-gradient(140deg,var(--g1),color-mix(in srgb,var(--g1) 45%,var(--g2)));position:relative;overflow:hidden;box-shadow:0 22px 36px -20px var(--g1)}
.board:before{content:"字";position:absolute;right:-14px;bottom:-46px;font:700 150px/1 "Noto Serif JP",serif;opacity:.12}
.board .bl{flex:1;min-width:0;position:relative}
.board .k{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.board .num{display:flex;align-items:baseline;gap:6px;margin:2px 0 12px}.board .num b{font-size:46px;line-height:1;font-weight:800;letter-spacing:-.04em}.board .num i{font-style:normal;opacity:.85;font-weight:600}
.stk{display:flex;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.25);gap:2px}.stk s{display:block;text-decoration:none;min-width:0}.stk .a{background:#fff}.stk .w{background:#FFD166}
.lg{display:flex;gap:12px;margin-top:10px;font-size:12px;font-weight:600;opacity:.92;flex-wrap:wrap}.lg span{display:flex;align-items:center;gap:5px}.lg i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4)}.lg .a i{background:#fff}.lg .w i{background:#FFD166}
.pc{width:84px;height:84px;border-radius:50%;flex:none;position:relative;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0)}.pc:after{content:"";position:absolute;inset:9px;border-radius:50%;background:color-mix(in srgb,var(--g1) 80%,#000)}.pc b{position:relative;z-index:1;font-size:20px;font-weight:800}
/* ===== COVER ===== */
.cv{border-radius:20px;display:grid;place-items:center;overflow:hidden;position:relative;color:#fff;flex:none;background:var(--dc,var(--pr))}
.cv:before{content:"";position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.3),transparent 55%)}
.cv img{width:100%;height:100%;object-fit:cover;display:block;position:relative}
.cv em{font-style:normal;font-weight:700;position:relative;opacity:.92;line-height:1}
/* ===== LIST ITEMS ===== */
.it{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}.it img{pointer-events:none}
.dg{opacity:.65;transform:scale(1.03);box-shadow:0 14px 34px rgba(0,0,0,.3)!important;z-index:3;position:relative}
.deck{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:26px;padding:10px 6px 10px 10px;margin-bottom:12px;box-shadow:0 0 0 1px var(--ln),var(--sh);position:relative;overflow:hidden;transition:transform .15s}
.deck:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:5px;border-radius:0 6px 6px 0;background:var(--dc)}
.deck:active,.tile:active,.les:active,.cd:active{transform:scale(.985)}
.deck .cv{width:62px;height:62px;border-radius:20px;margin-left:6px}.deck .cv em{font-size:30px}
.grow{flex:1;min-width:0}.grow b{display:block;font-weight:700;font-size:15.5px;line-height:1.25}.grow span{color:var(--mu);font-size:12.5px;font-weight:500}
.trk{height:6px;border-radius:999px;background:var(--s2);margin-top:8px;overflow:hidden}.trk i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--g1),var(--ok))}
.pcs{font-size:12.5px;font-weight:800;color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent);border-radius:999px;padding:4px 9px;flex:none}
.mb{width:36px;height:36px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--mu);cursor:pointer;flex:none}.mb:hover{background:var(--s2)}
.gp{width:24px;height:36px;display:grid;place-items:center;color:var(--mu);touch-action:none;cursor:grab;flex:none;opacity:.7}
.lst.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.tile{background:var(--sf);border-radius:28px;padding:8px 8px 10px;box-shadow:0 0 0 1px var(--ln),var(--sh);position:relative;transition:transform .15s;min-width:0}
.tile .cv{width:100%;aspect-ratio:1.15;border-radius:22px}.tile .cv em{font-size:64px}
.tile .tx{padding:10px 6px 0}.tile b{display:block;font-size:14.5px;line-height:1.25;font-weight:700}.tile span{color:var(--mu);font-size:12px;font-weight:500;display:block;margin-top:2px}
.tile .pcs{position:absolute;top:16px;left:16px;background:rgba(0,0,0,.35);color:#fff;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.tile .mb{position:absolute;top:14px;right:12px;background:rgba(0,0,0,.35);color:#fff;width:32px;height:32px}
.tile .gp{position:absolute;right:10px;bottom:6px}
.empty{text-align:center;color:var(--mu);padding:44px 20px;grid-column:1/-1}
/* ===== DETAIL HEADER ===== */
.hd{position:relative;color:#fff;padding:14px 18px 22px;border-radius:0 0 38px 38px;background:linear-gradient(160deg,var(--dc),color-mix(in srgb,var(--dc) 55%,#000));overflow:hidden;flex:none}
.hd:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.1)}
.hd .rb{background:rgba(255,255,255,.2);color:#fff;box-shadow:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hd .row1{display:flex;justify-content:space-between;align-items:center;position:relative}
.hd .hc{display:flex;align-items:center;gap:14px;margin-top:14px;position:relative}
.hd .cv{width:70px;height:70px;border-radius:24px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}.hd .cv em{font-size:34px}
.hd h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.15}.hd small{display:block;opacity:.85;font-weight:600;font-size:13px;margin-top:3px}
.hd .go{margin-top:16px;position:relative}
.btn{border:0;border-radius:999px;padding:14px 20px;font-weight:700;cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--g1),color-mix(in srgb,var(--g1) 55%,var(--g2)));color:#fff}
.btn:disabled{opacity:.4}.btn:active{transform:scale(.97)}
.btn.g{background:var(--s2);color:var(--tx)}.btn.d{background:none;color:var(--ac);padding:10px 12px}
.btn.w{background:#fff;color:#15122B;width:100%}
.les{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:24px;padding:12px 6px 12px 12px;margin-bottom:10px;box-shadow:0 0 0 1px var(--ln),var(--sh);transition:transform .15s}
.rg2{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--s2) 0)}.rg2:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--sf)}.rg2 b{position:relative;z-index:1;font-size:17px;font-weight:800}
.tools{display:flex;gap:8px;margin:2px 0 16px}.tools .btn{flex:1;padding:11px 10px;font-size:13px}
.cd{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:22px;padding:10px 4px 10px 10px;margin-bottom:9px;box-shadow:0 0 0 1px var(--ln);transition:transform .15s}
.tz{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;flex:none;font-size:26px;background:var(--s2);position:relative;overflow:hidden}
.tz:before{content:"";position:absolute;inset:6px;border:1.5px dashed var(--ln);border-radius:10px;opacity:.9}.tz img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tz:has(img):before{display:none}
.chip{font-size:11px;font-weight:800;border-radius:999px;padding:4px 9px;flex:none;background:var(--s2);color:var(--mu)}.chip.s1{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.chip.s2{background:color-mix(in srgb,var(--wa) 22%,transparent);color:var(--wa)}
/* ===== DOCK ===== */
.dockw{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:4;pointer-events:none}
.dock{flex:1;display:flex;gap:4px;padding:7px;border-radius:999px;background:color-mix(in srgb,var(--sf) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 0 0 1px var(--ln),0 18px 36px -12px rgba(30,20,90,.4);pointer-events:auto}
.dock button{flex:0 0 52px;height:52px;border:0;border-radius:999px;background:none;color:var(--mu);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-weight:700;font-size:13.5px;overflow:hidden;white-space:nowrap;transition:flex .3s cubic-bezier(.3,1.3,.5,1),background .2s,color .2s}
.dock button span{display:none}
.dock button.on{flex:1;background:var(--pr);color:var(--on)}.dock button.on span{display:inline}
.add{width:64px;height:64px;border-radius:24px;border:0;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,var(--g1)));color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;pointer-events:auto;box-shadow:0 16px 28px -10px var(--ac);transform:rotate(-4deg)}
.add:active{transform:scale(.92)}.add .i{width:28px;height:28px;stroke-width:2.4}
/* ===== SHEET ===== */
.ov{position:absolute;inset:0;background:rgba(8,6,22,.55);display:none;align-items:flex-end;z-index:8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}.ov.on{display:flex}
.sheet{background:var(--sf);width:100%;border-radius:34px 34px 0 0;padding:10px 20px 26px;max-height:92%;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 14px}
.sheet h2{margin:0 0 12px;font-size:20px;font-weight:800;letter-spacing:-.02em}.sheet p{color:var(--mu);margin:0 0 6px;font-size:13px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mu);margin:12px 0 5px;letter-spacing:.01em}
input,select{width:100%;padding:13px 15px;border-radius:18px;border:2px solid transparent;background:var(--s2);color:var(--tx);font:inherit}

.two{display:flex;gap:8px;margin-top:18px}.two .btn{flex:1}
.acl{display:grid;gap:8px}.ac1{display:flex;align-items:center;gap:12px;border:0;background:var(--s2);border-radius:20px;padding:15px 16px;font-weight:700;cursor:pointer}.ac1.dn{color:var(--ac)}

.prev{display:flex;gap:12px;align-items:center}.big2{width:84px;height:84px;border-radius:26px}
.up{width:56px;height:56px;padding:0;border:2px dashed var(--ln);background:none;color:var(--mu)}

/* ===== V3 PREMIUM ===== */

function dnd(box,arr){
 box.querySelectorAll('.it').forEach(it=>{it.onpointerdown=e=>{
  if(e.target.closest('.mb')||(e.pointerType=='mouse'&&e.button))return;
  const x0=e.clientX,y0=e.clientY,id=e.pointerId,touch=e.pointerType!='mouse',quick=!!e.target.closest('.gp');let on=false,tm=null;
  const start=()=>{on=true;DRG=true;it.classList.add('dg');try{it.setPointerCapture(id)}catch(_){}try{if(navigator.vibrate)navigator.vibrate(12)}catch(_){}};
  const end=()=>{clearTimeout(tm);it.removeEventListener('pointermove',mv);it.removeEventListener('pointerup',end);it.removeEventListener('pointercancel',end);
   if(on){on=false;DRG=false;DD=Date.now();it.classList.remove('dg');const ids=[...box.querySelectorAll('.it')].map(x=>x.dataset.id);arr.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));save()}};

   const el=document.elementsFromPoint(ev.clientX,ev.clientY).map(x=>x.closest('.it')).find(x=>x&&x!==it&&x.parentNode===box);
   if(el)box.insertBefore(it,(it.compareDocumentPosition(el)&4)?el.nextSibling:el);
   const mn=box.closest('.page');if(mn){const r=mn.getBoundingClientRect();if(ev.clientY<r.top+60)mn.scrollTop-=12;else if(ev.clientY>r.bottom-60)mn.scrollTop+=12}
  }

 }})
}

  o.innerHTML=`<div class="sheet"><h2>Pengatur waktu</h2><div class="tmbig dsp" id="tmb">${fmt(TM.left)}</div><label>Durasi</label><div class="gap"><div class="tf"><input id="tmh" type="number" min="0" max="99" inputmode="numeric" value="${Math.floor(TM.dur/3600)}"><small>jam</small></div><div class="tf"><input id="tmm" type="number" min="0" max="59" inputmode="numeric" value="${Math.floor(TM.dur%3600/60)}"><small>menit</small></div><div class="tf"><input id="tms" type="number" min="0" max="59" inputmode="numeric" value="${TM.dur%60}"><small>detik</small></div></div><div class="chips">${[5,10,25,45,60,90].map(x=>`<button data-m="${x}">${x>=60?(x/60+'').replace('.',',')+' jam':x+' menit'}</button>`).join('')}</div><label>Suara alarm</label><div class="chips snd">${SOUNDS.map(x=>`<button data-s="${x[0]}" class="${curSnd()==x[0]?'on':''}">${x[1]}</button>`).join('')}${CAL?`<button data-s="custom" class="${curSnd()=='custom'?'on':''}">${esc(CAL.n.slice(0,14))}</button>`:''}<button class="up2" id="aup" aria-label="Unggah suara alarm" title="Unggah suara alarm">${ic('up')}</button></div>${CAL?'<button class="btn d" id="adl">Hapus suara unggahan</button>':''}<input type="file" id="afl" accept="audio/*" hidden><div class="two"><button class="btn g" id="tr">${ic('rot')} Reset</button><button class="btn" id="tg">${ic(TM.on?'pause':'play')} ${TM.on?'Jeda':'Mulai'}</button></div></div>`;
  ['tmh','tmm','tms'].forEach(i=>$('#'+i).oninput=()=>{if(!TM.on)apply()});
  o.querySelectorAll('.chips:not(.snd) button').forEach(b=>b.onclick=()=>{const x=+b.dataset.m;$('#tmh').value=Math.floor(x/60);$('#tmm').value=x%60;$('#tms').value=0;if(!TM.on)apply();else toast('Reset dulu untuk durasi baru')});
  o.querySelectorAll('.snd button[data-s]').forEach(b=>b.onclick=()=>{ST.al=b.dataset.s;saveST();previewSnd(ST.al);o.querySelectorAll('.snd button[data-s]').forEach(x=>x.classList.toggle('on',x.dataset.s==ST.al))});
  $('#aup').onclick=()=>$('#afl').click();
  $('#afl').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>512000){toast('Maksimal 500 KB per suara');return}const rd=new FileReader();rd.onload=()=>{CAL={n:f.name,u:rd.result};try{localStorage.setItem('kcal',JSON.stringify(CAL))}catch(x){toast('Penyimpanan penuh');CAL=null;return}ST.al='custom';saveST();draw();previewSnd('custom')};rd.readAsDataURL(f)};
  if($('#adl'))$('#adl').onclick=()=>{CAL=null;try{localStorage.removeItem('kcal')}catch(x){}if(ST.al=='custom')ST.al='bip';saveST();draw()};
  $('#tr').onclick=()=>{if(apply()){tmReset();draw()}};
  $('#tg').onclick=()=>{if(TM.on){tmPause();draw()}else if(apply()){if(ALP){ALP.pause();ALP=null}tmStart();o.classList.remove('on');toast('Waktu berjalan')}};
 };
 draw();o.classList.add('on');
}
/* ===== STATS ===== */
function stats(m){
 const t=D.reduce((n,d)=>n+cnt(d.s),0),k=D.reduce((n,d)=>n+kn(d.s),0),w=D.reduce((n,d)=>n+fg2(d.s),0),b=Math.max(0,t-k-w),a=pct(k,t),a2=pct(k+w,t),g=goalN();
 const wk=[6,5,4,3,2,1,0].map(o=>{const d=dayN(o);return {l:DN[d.getDay()],c:G.days[dkey(d)]||0}});
 const mx=Math.max(g,...wk.map(x=>x.c),1),all=Object.values(G.days).reduce((s,x)=>s+x,0);
 m.innerHTML=`<header class="hdr"><div class="tt"><small>Perkembangan hafalanmu</small><h1 class="dsp">Statistik</h1></div>${themeBtn()}</header><main class="page"><div class="mini"><div><b class="dsp" style="color:var(--wa)">${streak()}</b><span>Hari beruntun</span></div><div><b class="dsp">${todayN()}<small style="font-size:15px;color:var(--mu)"> / ${g}</small></b><span>Kartu hari ini</span></div><div><b class="dsp">${all}</b><span>Total ulasan</span></div><div><b class="dsp" style="color:var(--ok)">${k}<small style="font-size:15px;color:var(--mu)"> / ${t}</small></b><span>Sudah hafal</span></div></div><div class="sec3"><h2 class="dsp">7 hari terakhir</h2></div><div class="wkc3">${wk.map(x=>`<div class="col"><div class="bt3"><i class="${x.c>=g?'hit':''}" style="height:${Math.round(x.c*100/mx)}%"></i></div><em>${x.c}</em><span>${x.l}</span></div>`).join('')}</div><div class="sec3"><h2 class="dsp">Hafalan</h2></div><div class="donut"><div class="dn" style="--a:${a};--b:${a2}"><b class="dsp">${a}%</b></div><div class="dl"><div><i style="background:var(--ok)"></i>Hafal<b>${k}</b></div><div><i style="background:var(--wa)"></i>Lupa<b>${w}</b></div><div><i style="background:var(--s2);box-shadow:inset 0 0 0 1px var(--ln)"></i>Belum<b>${b}</b></div></div></div><div class="sec3"><h2 class="dsp">Per deck</h2></div>${D.map(d=>{const a=cnt(d.s),b=kn(d.s);return `<div class="srow" style="--dc:${d.c}">${cover(d)}<div class="grow"><b>${esc(d.n)}</b><span>${b} dari ${a} kartu</span>${bar(pct(b,a))}</div><span class="pcs">${pct(b,a)}%</span></div>`}).join('')}<button class="btn g" id="rs" style="margin-top:6px;width:100%">${ic('rot')} Atur ulang semua progres</button></main>`;
 nav(m);bindTheme();
 $('#rs').onclick=()=>ask('Tandai semua kartu belum hafal?',()=>{D.forEach(d=>d.s.forEach(s=>s.k.forEach(c=>c.k=0)));save();render();toast('Progres diatur ulang')},'Atur ulang');
}
/* ===== TOMBOL KEMBALI ANDROID (history sinkron dengan kedalaman layar) ===== */
let HD=0,SKIP=0;
const depth=()=>{const ov=$('#ov');let d=S?5:(tab=='lib'?(V.v=='subs'?2:V.v=='cards'?3:1):(tab!='home'?1:(MN1?1:KZ?({menu:1,sub:2}[KZ.v]||3):0)));if(ov&&ov.classList.contains('on'))d++;const dw=$('#u2drw');if(dw&&dw.classList.contains('on'))d++;return d};
function sync(){const d=depth();if(d>HD){while(HD<d)history.pushState({h:++HD},'')}else if(d<HD){const n=HD-d;HD=d;SKIP++;history.go(-n)}}
function backOne(){const dw=$('#u2drw');if(dw&&dw.classList.contains('on')){dw.classList.remove('on');$('#u2dim').classList.remove('on');return}const ov=$('#ov');if(ov&&ov.classList.contains('on')){ov.classList.remove('on');return}if(TM.ring)return;if(S){stopAU();tmReset();S=null;save();render();return}if(tab=='lib'&&V.v=='cards'){V.v='subs';render();return}if(tab=='lib'&&V.v=='subs'){V={v:'home'};render();return}if(tab=='home'&&MN1){MN1=false;render();return}if(tab=='home'&&KZ){kzUp();render();return}if(tab!='home'){tab='home';V={v:'home'};render()}}
addEventListener('popstate',()=>{if(SKIP>0){SKIP--;return}if(HD<=0)return;HD--;backOne();sync()});

/* pintasan keyboard (desktop): Spasi/Enter balik kartu, 1/2/3 nilai, panah geser, Esc kembali */
addEventListener('keydown',e=>{
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable]'))return;
 const ov=$('#ov');
 if(e.key=='Escape'){if(ov&&ov.classList.contains('on')||S||tab!='home'||V.v!='home'){e.preventDefault();history.back()}return}
 if(!S||(ov&&ov.classList.contains('on')))return;
 const hit=id=>{const b=$(id);if(b&&!b.disabled){e.preventDefault();b.click();return true}};
 if(e.key==' '||e.key=='Enter'){if(e.target.closest&&e.target.closest('button'))return;(hit('#fp')||hit('#cc'))}
 else if(e.key=='ArrowRight')hit('#nx');else if(e.key=='ArrowLeft')hit('#pv');
 else if(e.key=='1')hit('#s0');else if(e.key=='2')hit('#s2');else if(e.key=='3')hit('#s1');
});

applyUI();applyFonts();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(ST.mode=='auto'){applyUI();render()}});
render();
new MutationObserver(sync).observe($('#app'),{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
</script><script>
(function(){
var DB='mn1file',ST='f';
function db(){return new Promise(function(ok,no){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){r.result.createObjectStore(ST)};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})}
function put(f){return db().then(function(d){return new Promise(function(ok){var t=d.transaction(ST,'readwrite');t.objectStore(ST).put({b:f,n:f.name,l:f.lastModified,t:f.type},'last');t.oncomplete=ok;t.onerror=ok})})}
function get(){return db().then(function(d){return new Promise(function(ok){var r=d.transaction(ST).objectStore(ST).get('last');r.onsuccess=function(){var v=r.result;ok(v?new File([v.b],v.n,{type:v.t,lastModified:v.l}):null)};r.onerror=function(){ok(null)}})}).catch(function(){return null})}
var orig=mnUp;
mnUp=function(f){if(f&&!f._r)put(f).catch(function(){});return orig.apply(this,arguments)};
var oRender=render,busy=false;
render=function(){var r=oRender.apply(this,arguments);
 if(MN1&&!MNU&&!busy&&document.getElementById('mnc')){busy=true;get().then(function(f){if(f&&MN1&&!MNU&&document.getElementById('mnc')){f._r=1;return mnUp(f)}}).finally(function(){busy=false})}
 return r};
if(MN1)render();
})();
</script></body></html>
